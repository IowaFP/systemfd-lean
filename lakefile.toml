name = "systemfd"
version = "0.1.0"
defaultTargets = ["systemfd"]

[[require]]
name = "lean-subst"
scope = "amarmaduke"
git = "https://github.com/amarmaduke/lean-subst"
rev = "7712e15"

[[require]]
name = "lilac"
scope = "amarmaduke"
git = "https://github.com/amarmaduke/lilac"
rev = "5e7f7a5"

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4/"
rev = "v4.32.0"


[[lean_lib]]
name = "Common"

[[lean_lib]]
name = "Core"

[[lean_lib]]
name = "Surface"

[[lean_lib]]
name = "Intermediate"

[[lean_lib]]
name = "Translation"

[[lean_exe]]
name = "systemfd"
root = "Main"
